<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美女角色系统集成测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #ff69b4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        
        .test-section h2 {
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        .status.success {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        
        .status.error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }
        
        .status.info {
            background: rgba(0, 150, 255, 0.2);
            border: 1px solid #0096ff;
            color: #0096ff;
        }
        
        canvas {
            border: 2px solid #ff69b4;
            border-radius: 10px;
            background: #000;
            display: block;
            margin: 20px auto;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #ff69b4;
        }
        
        .info-card h3 {
            color: #ff69b4;
            margin-top: 0;
        }
        
        .feature-list {
            list-style: none;
            padding: 0;
        }
        
        .feature-list li {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .feature-list li:before {
            content: "✨ ";
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 美女角色系统集成测试</h1>
        
        <div class="test-section">
            <h2>📋 系统状态检查</h2>
            <div id="system-status"></div>
        </div>
        
        <div class="test-section">
            <h2>🎮 游戏画面</h2>
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div class="controls">
                <button onclick="testCharacterAnimations()">测试动画切换</button>
                <button onclick="testInvincibilityEffect()">测试无敌效果</button>
                <button onclick="testShootingAnimation()">测试射击动画</button>
                <button onclick="resetTest()">重置测试</button>
            </div>
        </div>
        
        <div class="test-section">
            <h2>📊 测试结果</h2>
            <div id="test-results"></div>
        </div>
        
        <div class="info-panel">
            <div class="info-card">
                <h3>🎭 美女角色特性</h3>
                <ul class="feature-list">
                    <li>精美的美女角色设计</li>
                    <li>流畅的奔跑动画</li>
                    <li>优雅的跳跃动作</li>
                    <li>专业的射击姿态</li>
                    <li>华丽的无敌状态效果</li>
                </ul>
            </div>
            
            <div class="info-card">
                <h3>✨ 视觉效果系统</h3>
                <ul class="feature-list">
                    <li>发光和闪烁效果</li>
                    <li>粒子特效系统</li>
                    <li>心形和星形粒子</li>
                    <li>彩虹色彩变化</li>
                    <li>动态光环效果</li>
                </ul>
            </div>
            
            <div class="info-card">
                <h3>🎯 集成功能</h3>
                <ul class="feature-list">
                    <li>完整的游戏循环集成</li>
                    <li>动画系统连接</li>
                    <li>无敌状态逻辑</li>
                    <li>渲染系统优化</li>
                    <li>性能监控支持</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 加载游戏配置 -->
    <script src="js/config.js"></script>
    
    <!-- 加载核心系统 -->
    <script src="js/utils.js"></script>
    <script src="js/entities/entity.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/physics.js"></script>
    
    <!-- 加载美女角色系统 -->
    <script src="js/entities/characterAssets.js"></script>
    <script src="js/entities/characterEffects.js"></script>
    <script src="js/entities/player.js"></script>

    <script>
        // 全局变量
        let canvas, renderer, player;
        let testResults = [];
        
        // 初始化测试环境
        function initializeTest() {
            console.log('🎭 初始化美女角色系统集成测试...');
            
            canvas = document.getElementById('gameCanvas');
            renderer = new Renderer(canvas);
            
            // 创建玩家实例（美女角色）
            player = new Player(100, 300);
            
            // 检查系统状态
            checkSystemStatus();
            
            // 开始渲染循环
            startRenderLoop();
            
            console.log('✅ 测试环境初始化完成');
        }
        
        // 检查系统状态
        function checkSystemStatus() {
            const statusDiv = document.getElementById('system-status');
            const checks = [
                {
                    name: '美女角色玩家实例',
                    test: () => !!player,
                    details: player ? '玩家实例已创建' : '玩家实例创建失败'
                },
                {
                    name: 'CharacterAssets 系统',
                    test: () => !!(player && player.characterAssets),
                    details: player?.characterAssets ? 'CharacterAssets 已集成' : 'CharacterAssets 集成失败'
                },
                {
                    name: 'CharacterEffects 系统',
                    test: () => !!(player && player.characterEffects),
                    details: player?.characterEffects ? 'CharacterEffects 已集成' : 'CharacterEffects 集成失败'
                },
                {
                    name: '动画系统',
                    test: () => !!(player && player.characterAssets && player.characterAssets.animations),
                    details: player?.characterAssets?.animations ? '动画配置已加载' : '动画配置缺失'
                },
                {
                    name: '无敌状态系统',
                    test: () => !!(player && typeof player.setInvincible === 'function'),
                    details: player && typeof player.setInvincible === 'function' ? '无敌状态方法可用' : '无敌状态方法缺失'
                },
                {
                    name: '渲染系统',
                    test: () => !!(renderer && canvas),
                    details: renderer && canvas ? '渲染系统已初始化' : '渲染系统初始化失败'
                }
            ];
            
            let html = '';
            let allPassed = true;
            
            checks.forEach(check => {
                const passed = check.test();
                allPassed = allPassed && passed;
                
                html += `
                    <div class="status ${passed ? 'success' : 'error'}">
                        ${passed ? '✅' : '❌'} ${check.name}: ${check.details}
                    </div>
                `;
            });
            
            // 添加总体状态
            html = `
                <div class="status ${allPassed ? 'success' : 'error'}">
                    ${allPassed ? '🎉' : '⚠️'} 总体状态: ${allPassed ? '所有系统正常' : '存在系统问题'}
                </div>
            ` + html;
            
            statusDiv.innerHTML = html;
            
            return allPassed;
        }
        
        // 开始渲染循环
        function startRenderLoop() {
            function render() {
                // 清除画布
                renderer.clear();
                
                // 绘制背景
                renderer.fillRect(0, 0, canvas.width, canvas.height, '#001122');
                
                // 绘制地面
                renderer.fillRect(0, 350, canvas.width, 50, '#2d5016');
                
                // 更新和渲染美女角色
                if (player) {
                    player.update(0.016); // 假设60FPS
                    player.render(renderer);
                    
                    // 显示角色状态信息
                    const animInfo = player.getAnimationInfo();
                    renderer.drawText(
                        `美女角色状态: ${animInfo.state} (帧 ${animInfo.frame + 1}/${animInfo.totalFrames})`,
                        10, 30, '#ff69b4', '16px Arial'
                    );
                    
                    if (player.isInvincible()) {
                        const timeLeft = Math.ceil(player.getInvincibleTimeLeft());
                        renderer.drawText(
                            `✨ 华丽无敌状态: ${timeLeft}秒 ✨`,
                            10, 50, '#ffd700', '16px Arial'
                        );
                    }
                }
                
                // 显示操作提示
                renderer.drawText('空格键: 跳跃 | Q键: 射击 | 使用按钮测试各种功能', 10, canvas.height - 20, '#ffffff', '14px Arial');
                
                requestAnimationFrame(render);
            }
            
            render();
        }
        
        // 测试动画切换
        function testCharacterAnimations() {
            if (!player) return;
            
            const animations = ['running', 'jumping', 'shooting'];
            let currentIndex = 0;
            
            const switchAnimation = () => {
                const animState = animations[currentIndex];
                player.animationState = animState;
                player.characterAssets.updateAnimation(animState, 0.1);
                
                addTestResult(`动画切换测试: ${animState}`, true, `成功切换到${animState}动画`);
                
                currentIndex = (currentIndex + 1) % animations.length;
                
                if (currentIndex < animations.length) {
                    setTimeout(switchAnimation, 1000);
                }
            };
            
            addTestResult('开始动画切换测试', true, '测试美女角色的各种动画状态');
            switchAnimation();
        }
        
        // 测试无敌效果
        function testInvincibilityEffect() {
            if (!player) return;
            
            addTestResult('无敌效果测试', true, '激活美女角色华丽无敌状态');
            
            // 激活5秒无敌状态
            player.setInvincible(5);
            
            // 验证无敌状态
            setTimeout(() => {
                const isInvincible = player.isInvincible();
                const hasEffect = player.characterEffects.hasInvincibilityEffect();
                
                addTestResult(
                    '无敌状态验证', 
                    isInvincible && hasEffect,
                    `无敌状态: ${isInvincible}, 视觉效果: ${hasEffect}`
                );
            }, 100);
        }
        
        // 测试射击动画
        function testShootingAnimation() {
            if (!player) return;
            
            addTestResult('射击动画测试', true, '测试美女角色射击动作');
            
            // 切换到射击状态
            player.animationState = 'shooting';
            player.characterAssets.updateAnimation('shooting', 0.1);
            
            // 模拟射击
            if (player.canShootNow()) {
                const shootResult = player.shoot();
                addTestResult('射击功能测试', shootResult, shootResult ? '射击成功' : '射击失败');
            }
            
            // 2秒后恢复跑步状态
            setTimeout(() => {
                player.animationState = 'running';
                player.characterAssets.updateAnimation('running', 0.1);
                addTestResult('动画恢复', true, '恢复到跑步动画');
            }, 2000);
        }
        
        // 重置测试
        function resetTest() {
            if (player) {
                player.animationState = 'running';
                player.characterAssets.updateAnimation('running', 0.1);
                player.isInvincible = false;
                player.invincibleTimeLeft = 0;
                player.characterEffects.deactivateInvincibilityEffect();
            }
            
            testResults = [];
            updateTestResults();
            
            addTestResult('测试重置', true, '所有状态已重置');
        }
        
        // 添加测试结果
        function addTestResult(testName, success, details) {
            const result = {
                name: testName,
                success: success,
                details: details,
                timestamp: new Date().toLocaleTimeString()
            };
            
            testResults.push(result);
            updateTestResults();
            
            console.log(`${success ? '✅' : '❌'} ${testName}: ${details}`);
        }
        
        // 更新测试结果显示
        function updateTestResults() {
            const resultsDiv = document.getElementById('test-results');
            
            if (testResults.length === 0) {
                resultsDiv.innerHTML = '<div class="status info">暂无测试结果，点击按钮开始测试</div>';
                return;
            }
            
            let html = '';
            testResults.forEach(result => {
                html += `
                    <div class="status ${result.success ? 'success' : 'error'}">
                        <strong>${result.success ? '✅' : '❌'} ${result.name}</strong> (${result.timestamp})
                        <br><small>${result.details}</small>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        // 键盘事件处理
        document.addEventListener('keydown', (event) => {
            if (!player) return;
            
            switch (event.code) {
                case 'Space':
                    event.preventDefault();
                    player.jump();
                    addTestResult('跳跃测试', true, '美女角色执行跳跃动作');
                    break;
                case 'KeyQ':
                    event.preventDefault();
                    if (player.canShootNow()) {
                        const shootResult = player.shoot();
                        addTestResult('射击测试', shootResult, shootResult ? '美女角色射击成功' : '射击冷却中');
                    }
                    break;
            }
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎭 美女角色系统集成测试页面加载完成');
            initializeTest();
        });
    </script>
</body>
</html>
