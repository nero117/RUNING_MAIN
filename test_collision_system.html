<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碰撞检测系统单元测试</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-output {
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 10px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        .success {
            color: #4CAF50;
        }
        
        .error {
            color: #f44336;
        }
        
        .info {
            color: #2196F3;
        }
        
        .warning {
            color: #ff9800;
        }
        
        .stats {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        
        .stat-item {
            flex: 1;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .stat-label {
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 碰撞检测系统单元测试</h1>
        
        <div class="controls">
            <button onclick="runTests()" id="runButton">运行测试</button>
            <button onclick="clearOutput()" id="clearButton">清空输出</button>
        </div>
        
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-value" id="totalTests">0</div>
                <div class="stat-label">总测试数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="passedTests">0</div>
                <div class="stat-label">通过测试</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="failedTests">0</div>
                <div class="stat-label">失败测试</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">成功率</div>
            </div>
        </div>
        
        <div class="test-output" id="output">点击"运行测试"开始碰撞检测系统单元测试...</div>
    </div>

    <script>
        // 重定向 console.log 到页面输出
        const originalLog = console.log;
        const originalError = console.error;
        const output = document.getElementById('output');
        
        function appendOutput(message, className = '') {
            const div = document.createElement('div');
            div.textContent = message;
            if (className) {
                div.className = className;
            }
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        console.log = function(...args) {
            const message = args.join(' ');
            appendOutput(message);
            originalLog.apply(console, args);
        };
        
        console.error = function(...args) {
            const message = args.join(' ');
            appendOutput(message, 'error');
            originalError.apply(console, args);
        };
        
        function clearOutput() {
            output.innerHTML = '';
            document.getElementById('stats').style.display = 'none';
        }
        
        function updateStats(total, passed, failed) {
            document.getElementById('totalTests').textContent = total;
            document.getElementById('passedTests').textContent = passed;
            document.getElementById('failedTests').textContent = failed;
            document.getElementById('successRate').textContent = Math.round((passed / total) * 100) + '%';
            document.getElementById('stats').style.display = 'flex';
        }
        
        async function runTests() {
            const runButton = document.getElementById('runButton');
            runButton.disabled = true;
            runButton.textContent = '测试运行中...';
            
            clearOutput();
            
            try {
                // 加载并运行测试脚本
                const response = await fetch('collision_system_test.js');
                const testScript = await response.text();
                
                // 创建一个新的脚本元素来执行测试
                const script = document.createElement('script');
                script.textContent = testScript;
                document.head.appendChild(script);
                
                // 清理脚本元素
                document.head.removeChild(script);
                
            } catch (error) {
                console.error('测试执行失败:', error);
            } finally {
                runButton.disabled = false;
                runButton.textContent = '运行测试';
            }
        }
        
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            appendOutput('碰撞检测系统单元测试已准备就绪。', 'info');
            appendOutput('点击"运行测试"按钮开始测试。', 'info');
        });
    </script>
</body>
</html>
